
name: Selenium TestNG UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run TestNG suite
        run: mvn --batch-mode clean test -Dheadless=true

      - name: Upload test reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-results
          path: |
            target/surefire-reports/
            test-output/logs/
            test-output/screenshots/
          if-no-files-found: warn
          retention-days: 14
